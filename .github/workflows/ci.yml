# Flutter 客户端 CI：静态检查 + 单元/组件测试
# 说明：客户端为独立仓库，因此质量门禁在本仓库内闭环；后端仓库 CI 只负责 Go/契约/compose。
name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "tool/**"
      - "packages/**"
      - "pubspec.yaml"
      - "l10n.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "tool/**"
      - "packages/**"
      - "pubspec.yaml"
      - "l10n.yaml"
      - ".github/workflows/ci.yml"

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get
        run: flutter pub get

      # 改 ARB 后忘记跑生成时在这里失败。必须先 --check 再生成：
      # 顺序反过来（先重新生成）会让比对永远通过。
      - name: l10n check (arb 与 generated 是否同步)
        run: dart tool/gen_l10n.dart --check

      - name: l10n generate
        run: dart tool/gen_l10n.dart

      # 演出票务语义门禁：用户可见文案只能是企划口径。
      - name: forbidden terms check (演出票务语义)
        run: dart tool/check_forbidden_terms.dart

      # 只检查参与构建的目录，避免历史备份目录干扰门禁。
      - name: flutter analyze
        run: flutter analyze lib test packages/infras/core/lib

      - name: flutter test
        run: flutter test
