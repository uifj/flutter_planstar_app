# 应用级 l10n 配置。
#
# 目录约定：ARB 源文件与生成产物分开放。
#   - 应用级 ARB：`lib/l10n/arb/app_zh.arb` / `app_en.arb`（本文件驱动生成）
#   - feature 级 ARB：`lib/l10n/arb/features/<name>/<name>_zh.arb`
#   - 生成产物：`lib/l10n/generated/`（入库，勿手改）
#
# 应用级只放**跨 feature 共用**的文案：应用名、底栏 Tab、通用动作（重试/取消/确定/
# 保存）、通用状态（加载/空/网络错误/超时/登录失效/离线缓存）。
# feature 级生成入口是 `dart tool/gen_l10n.dart`——`flutter gen-l10n` 会读取
# 整个 `arb-dir` 下所有 `*_<locale>.arb`，多套 ARB 放在同一层会被判为重复 locale，
# 因此 feature ARB 放进 `arb/features/<name>/` 子目录。
#
# `flutter build` / `flutter run` 在 generate: true 下会自动重跑本文件的配置，
# 但**不会**管 feature 级，所以生成产物需要入库；改完 ARB 必须手动跑
# `dart tool/gen_l10n.dart`（CI 会用 `--check` 拦截忘记生成的情况）。
#
# 调用侧统一走 `lib/l10n/l10n.dart` 的 `context.l10n.xxx`：该文件是手写入口，
# re-export `lib/l10n/generated/` 下的全部生成类与 `AppL10n` 门面。
#
# `⚠` 相对来源的刻意改动：来源 `app_common` 有**两套** l10n
# （`lib/l10n/` 的 ARB 驱动 + `lib/localizations/` 的手写分文件，30-11）。
# 这里只有一套：ARB → gen-l10n 生成，手写的那套不要。
arb-dir: lib/l10n/arb
output-dir: lib/l10n/generated
synthetic-package: false
# `flutter build` 会自动按本文件重跑应用级 l10n；必须与 tool/gen_l10n.dart
# 的 CLI 行为一致（都不跑 dart format），否则构建后 `--check` 会因空白差异失败。
format: false
template-arb-file: app_zh.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
