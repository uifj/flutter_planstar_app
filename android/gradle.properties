org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 百度地图 SDK（com.baidu.lbsyun:BaiduMapSDK_Map:8.2.0）的 POM 仍依赖旧 android.arch
# 组（android.arch.lifecycle:extensions:1.1.1），其 AAR 清单会合并进
# android.arch.lifecycle.ProcessLifecycleOwnerInitializer 这个 ContentProvider，
# 在 Application 绑定阶段就引用 android.support.v4.app.FragmentManager。
# 由于 build.gradle.kts 排除了 com.android.support 组（避免与 androidx 的 Duplicate class），
# 该 provider 找不到类 → 进程启动即 FATAL NoClassDefFoundError（Flutter 代码还没跑起来）。
# 打开 Jetifier：把依赖里的 android.support.* / android.arch.* 引用与坐标统一重写到 androidx，
# 这样旧 SDK 与现有 androidx 运行时不再需要保留 com.android.support 产物。
# （AGP 9 将移除 Jetifier，届时需换成已迁移 androidx 的百度地图版本。）
android.enableJetifier=true
# 项目路径含非 ASCII（简历），关闭 AGP 的路径检查以便在 Windows 上构建。
android.overridePathCheck=true
